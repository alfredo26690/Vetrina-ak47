<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vetrina</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px 32px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .item {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
  }
  .item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: var(--card);
  }
  .item p {
    padding: 10px 12px;
    font-weight: 600;
    font-size: 16px;
  }
  .box {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 16px;
  }
  .box h2 {
    font-size: 15px;
    margin-bottom: 4px;
  }
  .box p {
    font-size: 14px;
    color: var(--hint);
  }
  .note {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: var(--hint);
  }
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--btn);
    color: var(--btn-text);
  }
  .btn.signal { background: #3a76f0; color: #fff; }
</style>
</head>
<body>

  <div class="grid">
    <div class="item"><img id="foto1" alt="Tokyo"><p>Tokyo</p></div>
    <div class="item"><img id="foto2" alt="Palermo"><p>Palermo</p></div>
    <div class="item"><img id="foto3" alt="Italia"><p>Italia</p></div>
    <div class="item"><img id="foto4" alt="Spagna"><p>Spagna</p></div>
  </div>

  <div class="box">
    <h2>📦 Spedizioni</h2>
    <p>Spedizioni piccole da 10€ · 2, max 3 giorni</p>
  </div>

  <button class="btn signal" id="btnSignal">Canale Signal</button>
  <button class="btn" id="btnTelegram">Contattami su Telegram</button>

  <p class="note">Per altri servizi chiedere in privato</p>

<script>
  // ====== MODIFICA QUI ======
  const CONFIG = {
    foto: [
      "https://i.ibb.co/8nb7fNnG/IMG-9989.jpg", // filtrato 5€ al g
      "https://i.ibb.co/BKF6BYwN/IMG-9991.png", // cipolle 1kg/500/100g
      "https://i.ibb.co/gkQLwrS/IMG-9992.png", // petardi/batterie
      "https://i.ibb.co/LDrfF8Kn/IMG-9996.jpg"  // rimborsi amzon/zalando/nike e altro 
    ],
    signal: "https://signal.group/#CjQKINhGwZShFiEhfCJUUM1ERBHy_zvkPEC2-R61N9G5xCxFEhCxZK490R5tUn8RcTxK9yXR",
    telegram: "shoppingak47"
  };
  // ==========================

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  CONFIG.foto.forEach((src, i) => {
    document.getElementById("foto" + (i + 1)).src = src;
  });

  document.getElementById("btnSignal").onclick = () => {
    if (tg && tg.openLink) tg.openLink(CONFIG.signal);
    else window.open(CONFIG.signal, "_blank");
  };

  document.getElementById("btnTelegram").onclick = () => {
    const url = "https://t.me/" + CONFIG.telegram.replace("@", "");
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, "_blank");
  };
</script>
</body>
</html>
